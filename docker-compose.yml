services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: printreg
    ports:
      - "54394:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d printreg"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8194:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/printreg
      JWT_SECRET: print-register-dev-secret
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/printreg
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3194:80"
    depends_on:
      - backend

volumes:
  pgdata:
